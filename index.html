<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Perform6 Admin</title>
    <script>
      (function () {
        var stored = localStorage.getItem('perform6-theme');
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (stored === 'dark' || (!stored && mq.matches)) {
          document.documentElement.classList.add('dark');
        }

        // Favicon follows browser chrome only:
        // light chrome → black mark, dark chrome → white mark.
        // Recreate <link> nodes so browsers actually pick up the change.
        function applyFavicon() {
          var dark = mq.matches;
          var svgHref = dark
            ? '/favicon-dark.svg?v=7'
            : '/favicon-light.svg?v=7';
          var pngHref = dark
            ? '/favicon-32x32-dark-scheme.png?v=7'
            : '/favicon-32x32.png?v=7';

          document
            .querySelectorAll('link[data-app-favicon]')
            .forEach(function (node) {
              node.parentNode.removeChild(node);
            });

          var svg = document.createElement('link');
          svg.setAttribute('data-app-favicon', 'svg');
          svg.rel = 'icon';
          svg.type = 'image/svg+xml';
          svg.href = svgHref;
          document.head.appendChild(svg);

          var png = document.createElement('link');
          png.setAttribute('data-app-favicon', 'png');
          png.rel = 'icon';
          png.type = 'image/png';
          png.sizes = '32x32';
          png.href = pngHref;
          document.head.appendChild(png);
        }

        applyFavicon();
        if (mq.addEventListener) mq.addEventListener('change', applyFavicon);
        else if (mq.addListener) mq.addListener(applyFavicon);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
