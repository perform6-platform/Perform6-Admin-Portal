<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!--
      Tab icon is vector artwork from the Perform6 symbol.
      Light = black P6, dark = white P6. The blue ring stays in both.
    -->
    <link
      rel="icon"
      href="/favicon-dark.svg?v=11"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-light.svg?v=11"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" href="/favicon.svg?v=11" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Perform6 Admin</title>
    <script>
      (function () {
        var stored = localStorage.getItem('perform6-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
