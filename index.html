<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!--
      macOS (Safari/Chrome): system Light/Dark Appearance selects favicon via
      prefers-color-scheme. Light = black P6, dark = white P6 (16×16 + 32×32).
    -->
    <link
      rel="icon"
      href="/favicon-32x32-dark-scheme.png?v=9"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-16x16-dark-scheme.png?v=9"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark.ico?v=9"
      type="image/x-icon"
      sizes="any"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-32x32.png?v=9"
      type="image/png"
      sizes="32x32"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon-16x16.png?v=9"
      type="image/png"
      sizes="16x16"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon.ico?v=9"
      type="image/x-icon"
      sizes="any"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" href="/favicon.svg?v=9" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=9" sizes="180x180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Perform6 Admin</title>
    <script>
      (function () {
        var stored = localStorage.getItem('perform6-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
